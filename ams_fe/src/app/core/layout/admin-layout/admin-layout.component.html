<div class="ams-shell flex h-screen" [class.ams-shell--dark]="theme === 'dark'">
  <aside class="ams-sidebar flex flex-col shadow-2xl" [class.ams-sidebar--compact]="compactSidebar">
    <div class="p-6 border-b border-gray-700">
      <div class="flex items-center gap-4">
        <div class="relative">
          <div class="w-14 h-14 bg-gradient-to-br from-blue-400 via-blue-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-2xl transform hover:scale-105 transition-transform">
            <span class="text-3xl font-black text-white tracking-tighter">A</span>
          </div>
          <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-gradient-to-br from-slate-400 to-slate-500 rounded-full border-3 border-gray-900 flex items-center justify-center shadow-lg">
            <div class="w-2 h-2 bg-white rounded-full"></div>
          </div>
        </div>
        <div>
          <h1 class="ams-brand-title text-3xl tracking-tight">
            AMS Core
          </h1>
          <p class="ams-brand-subtitle ams-sidebar-copy text-xs mt-1 tracking-wide uppercase">
            Attendance & HR
          </p>
        </div>
      </div>
    </div>

    <nav class="flex-1 p-4 pb-12 space-y-1 overflow-y-auto min-w-0">
      <a
        *ngFor="let item of visibleNavItems"
        [routerLink]="resolveNavPath(item)"
        #navLink
        class="w-full flex items-center gap-3 rounded-xl transition-all group"
        [ngClass]="[densityClass, isActive(item) ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-300 hover:bg-gray-800 hover:text-white']"
      >
        <lucide-icon
          [name]="item.icon"
          class="w-5 h-5"
          [ngClass]="isActive(item) ? '' : 'group-hover:scale-110 transition-transform'"
        ></lucide-icon>
        <span class="ams-sidebar-copy flex-1 text-left font-medium">{{ item.label }}</span>
        <lucide-icon *ngIf="isActive(item)" name="chevron-right" class="w-4 h-4"></lucide-icon>
      </a>
    </nav>

    <div class="ams-sidebar-footer p-4 border-t border-gray-700">
      <div class="ams-sidebar-copy text-xs text-gray-400">
        <p>© 2026 AMS Core</p>
        <p class="mt-1">Version 2.4.1</p>
      </div>
    </div>
  </aside>

  <div class="flex-1 flex flex-col">
    <header class="ams-header px-6 py-4 flex items-center justify-end shadow-sm">
      <div class="flex items-center ml-auto">
        <button
          (click)="toggleUserMenu()"
          class="flex items-center gap-3 hover:bg-gray-100 rounded-lg px-3 py-1 transition-colors"
        >
          <div class="text-right">
            <p class="text-sm font-semibold text-gray-900">{{ displayUsername }}</p>
            <p class="text-xs text-gray-600">{{ displayRoleLabel }}</p>
          </div>
          <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-700 rounded-full flex items-center justify-center text-white font-bold shadow-md">
            {{ displayInitials }}
          </div>
        </button>
      </div>
    </header>

    <main class="ams-main flex-1 overflow-y-auto min-w-0 p-8">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div *ngIf="userMenuOpen" class="fixed top-16 right-8 w-56 bg-white shadow-xl z-50 rounded-lg">
    <div class="p-4">
      <button
        (click)="navigateTo('/profile')"
        class="flex items-center gap-3 w-full py-2 px-4 text-left hover:bg-gray-100 rounded-lg"
      >
        <lucide-icon name="user" class="w-5 h-5 text-gray-600"></lucide-icon>
        <span class="text-sm font-semibold">Profile</span>
      </button>
      <button
        (click)="logout()"
        class="flex items-center gap-3 w-full py-2 px-4 text-left hover:bg-gray-100 rounded-lg"
      >
        <lucide-icon name="log-out" class="w-5 h-5 text-gray-600"></lucide-icon>
        <span class="text-sm font-semibold">Logout</span>
      </button>
    </div>
  </div>

  <!-- Chatbot Floating Widget -->
  <app-ai-chatbot></app-ai-chatbot>
</div>
