spring.application.name=ams_be
spring.datasource.url=jdbc:mysql://localhost:3307/attendance_management_system?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Embedded Tomcat Server Optimization
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=8192
server.tomcat.accept-count=100

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32+_CHARS
app.jwt.access-ttl-seconds=900
app.jwt.refresh-ttl-seconds=1209600

spring.data.redis.host=localhost
spring.data.redis.port=6379

logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.web.FilterChainProxy=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:huytrongk8a@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

file.upload-dir=uploads/avatars

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB


minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:ams_minio_8f3a9c2e1b7d4f60}
minio.secret-key=${MINIO_SECRET_KEY:Xk7pQ2vN9wL4rT8yZ1mB6cJ3hF5sD0uA}
minio.bucket=${MINIO_BUCKET:avatars}
