<!-- Floating Action Button -->
<button
  class="chatbot-fab"
  id="chatbot-fab-btn"
  [class.chatbot-fab--open]="isOpen"
  (click)="toggleChat()"
  aria-label="Toggle AI Assistant"
>
  <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
  </svg>
  <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </svg>
</button>

<!-- Chat Window -->
<div class="chatbot-window" [class.chatbot-window--visible]="isOpen" role="dialog" aria-label="AMS AI Assistant">
  <!-- Header -->
  <div class="chatbot-header">
    <div class="chatbot-header__info">
      <div class="chatbot-header__avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
        </svg>
      </div>
      <div>
        <div class="chatbot-header__name">AMS AI Assistant</div>
        <div class="chatbot-header__status">
          <span class="chatbot-status-dot"></span>
          Trực tuyến
        </div>
      </div>
    </div>
    <button class="chatbot-header__close" (click)="closeChat()" aria-label="Close chat">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Messages -->
  <div class="chatbot-body" #messagesContainer>
    <ng-container *ngFor="let msg of messages; trackBy: trackByMessage">
      <!-- AI Message -->
      <div class="chatbot-message chatbot-message--ai" *ngIf="msg.sender === 'ai'">
        <div class="chatbot-message__avatar">AI</div>
        <div class="chatbot-message__content-wrap">
          <div class="chatbot-message__bubble chatbot-message__bubble--ai">
            {{ msg.content }}
          </div>
          <div class="chatbot-message__time">{{ msg.timestamp | date: 'HH:mm' }}</div>
          <!-- Suggestions -->
          <div class="chatbot-suggestions" *ngIf="msg.suggestions && msg.suggestions.length > 0">
            <button
              class="chatbot-suggestion-btn"
              *ngFor="let suggestion of msg.suggestions"
              (click)="sendMessage(suggestion)"
            >
              {{ suggestion }}
            </button>
          </div>
        </div>
      </div>

      <!-- User Message -->
      <div class="chatbot-message chatbot-message--user" *ngIf="msg.sender === 'user'">
        <div class="chatbot-message__content-wrap chatbot-message__content-wrap--user">
          <div class="chatbot-message__bubble chatbot-message__bubble--user">
            {{ msg.content }}
          </div>
          <div class="chatbot-message__time chatbot-message__time--right">{{ msg.timestamp | date: 'HH:mm' }}</div>
        </div>
      </div>
    </ng-container>

    <!-- Typing Indicator -->
    <div class="chatbot-message chatbot-message--ai chatbot-typing" *ngIf="isTyping">
      <div class="chatbot-message__avatar">AI</div>
      <div class="chatbot-message__bubble chatbot-message__bubble--ai">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chatbot-footer">
    <div class="chatbot-input-wrap">
      <textarea
        class="chatbot-input"
        id="chatbot-input"
        placeholder="Nhập câu hỏi của bạn..."
        [(ngModel)]="inputText"
        (keydown)="onKeydown($event)"
        rows="1"
        [disabled]="isTyping"
      ></textarea>
      <button
        class="chatbot-send-btn"
        id="chatbot-send-btn"
        [disabled]="!inputText.trim() || isTyping"
        (click)="sendMessage()"
        aria-label="Send message"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="chatbot-footer__hint">Enter để gửi • Shift+Enter xuống dòng</div>
  </div>
</div>
