<div class="fixed right-0 top-0 h-screen w-[420px] bg-white shadow-2xl flex flex-col border-l border-gray-200 z-50">
  <div class="border-b border-gray-200 p-6 flex items-center justify-between">
    <div>
      <h2 class="text-xl font-semibold text-gray-900">AI Assistant</h2>
      <p class="text-sm text-gray-600">Placeholder only</p>
    </div>
    <button (click)="closed.emit()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
      <lucide-icon name="x" class="w-5 h-5"></lucide-icon>
    </button>
  </div>

  <div class="flex-1 flex items-center justify-center p-8 text-center bg-gray-50">
    <div>
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-gray-200">
        <lucide-icon name="sparkles" class="w-6 h-6 text-gray-500"></lucide-icon>
      </div>
      <h3 class="text-lg font-semibold text-gray-900">No Chatbot Backend</h3>
      <p class="mt-2 text-sm text-gray-600">
        This shell no longer simulates AI answers. Re-enable it only after a real chatbot API/domain exists.
      </p>
    </div>
  </div>
</div>
