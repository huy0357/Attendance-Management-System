spring.application.name=ams_be
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_management_system?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32+_CHARS
app.jwt.access-ttl-seconds=900
app.jwt.refresh-ttl-seconds=1209600

spring.data.redis.host=localhost
spring.data.redis.port=6379


# nmhung added 3/2/26
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG
#
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh



